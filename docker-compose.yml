services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: heatnet
      POSTGRES_USER: heatnet
      POSTGRES_PASSWORD: heatnet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatnet"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: heatnet
      DB_USER: heatnet
      DB_PASSWORD: heatnet
      # Значение по умолчанию — для конкурсной машины с 16 ГБ ОЗУ.
      JAVA_OPTS: ${JAVA_OPTS:--Xmx12g}
      HEATNET_TRACING_WORKERS: ${HEATNET_TRACING_WORKERS:-1}
      HEATNET_TRACING_QUEUE_CAPACITY: ${HEATNET_TRACING_QUEUE_CAPACITY:-100}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - appdata:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8080/api/v1/rules"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  appdata:
