# Пример расширения справочника пространственных ограничений.
#
# Встроенные правила соответствуют таблице 2 технического приложения и
# действуют всегда; этот файл дополняет или переопределяет их БЕЗ изменения
# кода. Подключение:
#   CLI:    --rules=config/rules-example.yml
#   Сервис: переменная окружения HEATNET_RULES_FILE или свойство
#           heatnet.rules-file в application.yml
#
# Поля правила:
#   mode            forbidden | special
#   min_distance    минимальный горизонтальный отступ, м
#   min_distance_by_du   отступ, зависящий от ДУ новой сети (как у ОКС: 5/7/9 м)
#   min_angle       минимальный угол пересечения, град (для special)
#   special_margin  граница спецучастка: за полигоном / от точки пересечения, м
#   k_spec          коэффициент удорожания спецпрохода
#   own_half_width  собственный габарит препятствия (полуширина), м

restrictions:
  # --- новые типы: классы дорог ---
  road_highway:            # магистраль — пересекать нельзя, только обход
    mode: forbidden
    min_distance: 3.0

  road_local:              # внутриквартальный проезд — спецпроход дешевле дороги
    mode: special
    min_distance: 1.5
    min_angle: 45
    special_margin: 3.0
    k_spec: 1.40

  # --- другие коммуникации ---
  water_pipeline:          # водопровод: как газопровод, но свой габарит и Kспец
    mode: special
    min_distance: 1.5
    special_margin: 2.0
    k_spec: 1.20
    own_half_width: 0.25

  metro:                   # объекты метрополитена — непроходимы, большой отступ
    mode: forbidden
    min_distance: 8.0

  # --- переопределение встроенного правила (пример) ---
  # park:
  #   min_distance: 2.0

  # --- поведение для типов, не описанных ни здесь, ни в таблице 2 ---
  unknown_default:
    mode: forbidden
    min_distance: 1.0

# Пересечение существующей тепловой сети без врезки (строка таблицы 2)
