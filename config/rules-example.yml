# Пример расширения справочника пространственных ограничений.
#
# Встроенные правила соответствуют таблице 2 технического приложения и
# действуют всегда; этот файл дополняет или переопределяет их БЕЗ изменения
# кода. Подключение:
#   CLI:    --rules=config/rules-example.yml
#   Сервис: переменная окружения HEATNET_RULES_FILE или свойство
#           heatnet.rules-file в application.yml
#
# Поля правила:
#   mode            forbidden | special
#   min_distance    минимальный горизонтальный отступ, м
#   min_distance_by_du   отступ, зависящий от ДУ новой сети (как у ОКС: 5/7/9 м)
#   min_angle       минимальный угол пересечения, град (для special)
#   special_margin  граница спецучастка: за полигоном / от точки пересечения, м
#   k_spec          коэффициент удорожания спецпрохода
#   own_half_width  собственный габарит препятствия (полуширина), м
#
# Числа задаются без кавычек: конечные, размеры/отступы >= 0,
# k_spec >= 1, min_angle в диапазоне 0..90. Неизвестные поля, повторные
# YAML-ключи и несколько документов в одном файле отклоняются.
# min_distance_by_du — массив объектов с обязательным distance >= 0;
# max_du — положительное целое (до 2147483647), без повторов. Отсутствие
# max_du означает открытый диапазон; выше последнего порога действует
# его отступ. Порядок строк свободный, [] явно удаляет прежние пороги.
# min_distance без min_distance_by_du также заменяет прежние пороги.

restrictions:
  # --- новые типы: классы дорог ---
  road_highway:            # магистраль — пересекать нельзя, только обход
    mode: forbidden
    min_distance: 3.0

  road_local:              # внутриквартальный проезд — спецпроход дешевле дороги
    mode: special
    min_distance: 1.5
    min_angle: 45
    special_margin: 3.0
    k_spec: 1.40

  # --- другие коммуникации ---
  water_pipeline:          # водопровод: как газопровод, но свой габарит и Kспец
    mode: special
    min_distance: 1.5
    special_margin: 2.0
    k_spec: 1.20
    own_half_width: 0.25

  metro:                   # объекты метрополитена — непроходимы, большой отступ
    mode: forbidden
    min_distance: 8.0

  # --- переопределение встроенного правила (пример) ---
  # park:
  #   min_distance: 2.0

  # --- поведение для типов, не описанных ни здесь, ни в таблице 2 ---
  unknown_default:
    mode: forbidden
    min_distance: 1.0

# Правила пересечения существующей теплосети (строка таблицы 2).
# obstacle_top_depth — единая глубина верха исходной сети: и для пересечений,
# и для врезок через существующую/новую камеру на исходной трубе.
# По умолчанию 3.0 м; YAML-переопределение — расширение модели сервиса.
# При crossing: under это поле также сохраняет глубину исходной сети,
# а min_top_depth отдельно задаёт минимальную глубину нового прохода.
# Здесь mode допускает только special; min_angle и own_half_width должны
# отсутствовать или быть 0: угол не ограничивается, габарит берётся по ДУ
# исходной трубы. Иные значения отклоняются, а не молча игнорируются.
# Обычная глубина новой сети и порог Kгл остаются 3.0 м, уклон <= 0.10 м/м.
# Глубина врезки < 0.7 м исключит глубинный вариант с диагностикой;
# допустимый базовый 2D-результат останется доступным.
# heat_network_crossing:
#   k_spec: 1.05
#   special_margin: 2.0
#   vertical:
#     crossing: above_or_below
#     obstacle_top_depth: 3.0
